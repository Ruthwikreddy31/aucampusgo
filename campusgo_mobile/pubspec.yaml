name: campusgo_mobile
description: CampusGo ZestModel Delivery Mobile Application (Flutter, Riverpod, GoRouter, Dio, Geolocator, Socket.IO)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  go_router: ^13.0.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  geolocator: ^10.1.0
  permission_handler: ^11.1.0
  socket_io_client: ^2.0.3+1
  intl: ^0.18.1
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
